# ==========================================
#  DAPLink / CMSIS-DAP 仿真器（本次只配这个）
#  适用: 各类 DAPLink、Nucleo 板载调试器、无线调试器(如 WCH-Link 的 DAP 模式)
# ==========================================
adapter driver cmsis-dap      ;# 驱动类型: CMSIS-DAP 协议
transport select swd          ;# 走 SWD 两线(PA13/PA14)，比 JTAG 省引脚
adapter speed 2000            ;# 2MHz；连不上或报错就降到 500